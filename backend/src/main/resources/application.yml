spring:
  application:
    name: smart-wallet
  datasource:
    url: jdbc:postgresql://localhost:5432/smartwallet
    username: postgres
    password: postgres
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate.jdbc.time_zone: UTC
  flyway:
    locations: classpath:db/migration
    baseline-on-migrate: true

server:
  port: 8000
  servlet:
    context-path: ""

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /docs

jwt:
  secret: change-me
  algorithm: HS256
  access-token-expire-minutes: 30

assistant:
  ollama:
    enabled: ${ASSISTANT_OLLAMA_ENABLED:true}
    base-url: ${ASSISTANT_OLLAMA_BASE_URL:http://localhost:11434}
    model: ${ASSISTANT_OLLAMA_MODEL:qwen2.5:1.5b}
    connect-timeout-ms: 5000
    read-timeout-ms: 120000

logging:
  level:
    root: INFO
    org.springframework.security: INFO
