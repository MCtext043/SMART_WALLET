services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartwallet
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d smartwallet"]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - smartwallet-pg-data:/var/lib/postgresql/data
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped
    # Доступ только из docker-сети (api → ollama:11434). Наружу не публикуем.

  api:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartwallet
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      JWT_SECRET: ${JWT_SECRET:-change-me}
      ASSISTANT_OLLAMA_ENABLED: "true"
      ASSISTANT_OLLAMA_BASE_URL: http://ollama:11434
      ASSISTANT_OLLAMA_MODEL: ${ASSISTANT_OLLAMA_MODEL:-qwen2.5:1.5b}
    depends_on:
      db:
        condition: service_healthy
      ollama:
        condition: service_started
    restart: unless-stopped

volumes:
  smartwallet-pg-data:
  ollama-data:
